  if(!API_URL){const u=($("apiurl").value||"").trim();if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){$("lerr").textContent="Web app URL ไม่ถูกต้อง (ต้องขึ้นต้น https://script.google.com และลงท้าย /exec)";return}try{localStorage.setItem("tcas-api",u)}catch(e){}}
  if(!code){$("lerr").textContent="กรอกรหัสผู้ใช้";return}
  $("lerr").textContent="กำลังเข้าสู่ระบบ…";
  try{const r=await api("login",{code});TOKEN=r.token;try{localStorage.setItem("tcas-token",TOKEN)}catch(e){}$("code").value="";await enter(r.me)}catch(e){$("lerr").textContent=errTxt(e)}}
function logout(msg){TOKEN="";try{localStorage.removeItem("tcas-token")}catch(e){}clearInterval(pollT);S=[];USERS=[];STAFF=[];cur=null;SINCE=0;PEND={};ME={id:"",owner:false,reg:false,name:"",joined:""};render();showLogin(msg||"")}
async function enter(m){ME={id:m.id,owner:m.role==="main",reg:true,name:m.name,joined:""};mode="shared";hv=ME.owner?"all":"mine";sf="";
  STAFF=[{id:ME.id,name:ME.name,joined:"",seen:""}];S=[];SINCE=0;PEND={};hideLogin();toast("กำลังโหลดข้อมูล…");
  try{await pull(true);if(ME.owner)await loadUsers()}catch(e){fail(e,"โหลดข้อมูลไม่สำเร็จ")}
  render();clearInterval(pollT);pollT=setInterval(poll,30000)}
async function loadUsers(){const r=await api("users");USERS=r.users;MAXSUB=r.max||0;
  STAFF=[{id:"main",name:"เจ้าของระบบ (Main)",joined:"",seen:""}].concat(USERS.map(u=>({id:u.id,name:u.name+(u.active?"":" (ปิดใช้งาน)"),joined:u.created?iso(new Date(+u.created)):"",seen:u.lastSeen?iso(new Date(+u.lastSeen)):"",active:u.active})))}
async function pull(full){const r=await api("list",{since:full?0:SINCE});SINCE=Math.max(0,r.now-3000);let ch=!!full;
  r.students.forEach(x=>{const n=norm(x);if(PEND[n.id]>0)return;const i=S.findIndex(o=>o.id===n.id);if(i>=0)S[i]=n;else S.push(n);ch=true});
  const ids=new Set(r.ids),b=S.length;S=S.filter(o=>ids.has(o.id)||PEND[o.id]>0);if(S.length!==b)ch=true;return ch}
async function poll(){if(!TOKEN||typing||document.visibilityState==="hidden")return;const ae=document.activeElement;if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;
  try{let ch=await pull(false);tick++;if(ME.owner&&tick%4===0){await loadUsers();ch=true}if(ch)render()}catch(e){fail(e)}}
async function init(){mode="shared";ME={id:"",owner:false,reg:false,name:"",joined:""};
  try{TOKEN=localStorage.getItem("tcas-token")||""}catch(e){TOKEN=""}
  render();
  if(!apiUrl()){showLogin("ตั้งค่า Web app URL แล้วเข้าสู่ระบบ");return}
  if(!TOKEN){showLogin();return}
  try{const m=await api("me");await enter(m)}catch(e){showLogin(AUTHERR.test(String(e&&e.message))?"กรุณาเข้าสู่ระบบ":errTxt(e))}}
function askText(msg,val){return new Promise(res=>{const d=$("dlg");d.innerHTML=`<div class="dbox" role="dialog" aria-modal="true"><p style="margin:0 0 10px">${esc(msg)}</p><input id="dtx" value="${esc(val||"")}" maxlength="40" style="width:100%;font:inherit;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)"><div class="row" style="justify-content:flex-end;margin-top:12px"><button id="dn">ยกเลิก</button><button class="primary" id="dy">ตกลง</button></div></div>`;d.hidden=false;
  const done=v=>{d.hidden=true;d.innerHTML="";res(v)};$("dy").onclick=()=>done(($("dtx").value||"").trim()||null);$("dn").onclick=()=>done(null);$("dtx").focus()})}
function showCode(name,code){const d=$("dlg");d.innerHTML=`<div class="dbox" role="dialog" aria-modal="true"><p style="margin:0 0 6px">รหัสเข้าใช้ของ <b>${esc(name)}</b></p><div style="font-size:1.8rem;letter-spacing:.12em;font-weight:600;text-align:center;padding:10px;background:var(--accent-soft);border-radius:12px;user-select:all">${esc(code)}</div><p class="src" style="margin:10px 0">รหัสนี้แสดงครั้งเดียว คัดลอกแล้วส่งให้พนักงานเอง หากทำหาย กด "รีเซ็ตรหัส" เพื่อออกรหัสใหม่</p><div class="row" style="justify-content:flex-end"><button id="dcopy">คัดลอก</button><button class="primary" id="dy">ปิด</button></div></div>`;d.hidden=false;
  $("dy").onclick=()=>{d.hidden=true;d.innerHTML=""};$("dcopy").onclick=()=>{try{navigator.clipboard.writeText(code).then(()=>toast("คัดลอกแล้ว"),()=>toast("คัดลอกไม่ได้ ให้เลือกข้อความเอง"))}catch(e){toast("คัดลอกไม่ได้ ให้เลือกข้อความเอง")}}}
function showLink(url){const d=$("dlg");d.innerHTML=`<div class="dbox" role="dialog" aria-modal="true"><p style="margin:0 0 10px">สร้าง Google Sheet ใน Drive ของคุณแล้ว</p><p style="margin:0 0 14px"><a href="${esc(url)}" target="_blank" rel="noopener">เปิด Google Sheet</a></p><div class="row" style="justify-content:flex-end"><button class="primary" id="dy">ปิด</button></div></div>`;d.hidden=false;$("dy").onclick=()=>{d.hidden=true;d.innerHTML=""}}
function mkSheet(wb,title){const sheets=wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:""})}));toast("กำลังสร้าง Google Sheet…");
  api("sheet",{title,sheets}).then(r=>showLink(r.url)).catch(e=>fail(e,"สร้าง Google Sheet ไม่สำเร็จ"))}


/* calc */
const tdates=(p,t)=>t===1?{start:p.ustart||p.start,end:p.uend||p.end}:{start:p.start,end:p.end};
function tspans(st){const o=[];SUBJ.forEach(s=>{const p=st.subj[s];if(!p.on)return;[0,1].forEach(t=>{if(p.t[t]){const d=tdates(p,t);o.push({s,t,start:d.start,end:d.end})}})});return o}
function frac(p,t){const d=tdates(p,t||0);if(!d.start||!d.end||!(D0(d.end)>D0(d.start)))return null;return Math.max(0,Math.min(1,(D0(TODAY)-D0(d.start))/(D0(d.end)-D0(d.start))))}
function agg(st,s,t){let total=0,done=0,plan=0,n=0,np=false;
  SUBJ.forEach(sj=>{if(s!=null&&sj!==s)return;const p=st.subj[sj];if(!p.on)return;
    C.forEach(x=>{if(x.s!==sj||(t!=null&&x.t!==t)||!p.t[x.t])return;const f=frac(p,x.t);total+=x.h;done+=Math.min(x.h,st.w[x.c]||0);plan+=x.h*(f||0);n++;if(f==null)np=true})});
  return{total,done,plan,n,np}}
function chip(a){if(!a.n)return'<span class="chip wait">–</span>';if(a.np)return'<span class="chip wait">ยังไม่ตั้งแผน</span>';
  const g=a.done-a.plan;if(a.plan<.05&&a.done<.05)return'<span class="chip wait">ยังไม่ถึงกำหนด</span>';
  if(Math.abs(g)<.05)return'<span class="chip ok">ตามแผน</span>';
  return g>0?`<span class="chip ok">ล้ำหน้า +${fh(g)} ชม.</span>`:`<span class="chip bad">ล่าช้า ${fh(-g)} ชม.</span>`}
function due(st){let b=null;tspans(st).forEach(z=>{if(!z.end)return;const a=agg(st,z.s,z.t);if(!a.n||a.total-a.done<.05)return;
  const d=Math.round((D0(z.end)-D0(TODAY))/864e5);if(!b||d<b.d)b={d,s:z.s+" ("+TR[z.t]+")",r:Math.max(0,a.total-a.done)}});return b}
function dueTxt(st){const b=due(st);if(!b)return"–";return b.d<0?`<span class="chip bad">เลยกำหนด ${-b.d} วัน</span><div class="src">${b.s} · เหลือ ${fh(b.r)} ชม.</div>`:`อีก ${b.d} วัน<div class="src">${b.s} · เหลือ ${fh(b.r)} ชม.</div>`}


const mon=s=>{const d=D0(s),k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)};
const addDays=(s,n)=>{const d=D0(s);d.setDate(d.getDate()+n);return iso(d)};
function weeks(st){const E=tspans(st).filter(x=>x.start);if(!E.length)return[];
  const a=E.map(x=>x.start).sort()[0],ends=tspans(st).map(x=>x.end).filter(Boolean).sort(),cw=mon(TODAY);
  const last=ends.length&&ends[ends.length-1]>cw?mon(ends[ends.length-1]):cw;
  let w=mon(a);const out=[];while(w<=last&&out.length<80){out.push(w);w=addDays(w,7)}return out}
function wauto(st,s,w){const p=st.subj[s];if(!p.on)return 0;let r=0;
  [0,1].forEach(t=>{if(!p.t[t])return;const d=tdates(p,t);if(!d.start||!d.end||!(D0(d.end)>D0(d.start)))return;
    const a=Math.max(D0(w),D0(d.start)),b=Math.min(D0(addDays(w,7)),D0(d.end)),dy=Math.max(0,(b-a)/864e5);
    r+=agg(st,s,t).total*dy/((D0(d.end)-D0(d.start))/864e5)});return r}
function wplan(st,s,w){const o=(st.wp||{})[w];if(st.subj[s].on&&o&&o[s]!==undefined)return o[s];return wauto(st,s,w)}
const wact=(st,s,w)=>((st.wk||{})[w]||{})[s]||0;
function wtot(st,w){let a=0,p=0;SUBJ.forEach(s=>{if(!st.subj[s].on)return;a+=wact(st,s,w);p+=wplan(st,s,w)});return{a,p}}
function wchip(a,p,isCur){if(p<.05&&a<.05)return'<span class="chip wait">–</span>';
  if(a>=p-.05)return`<span class="chip ok">${a>p+.05?"เกินแผน +"+fh(a-p)+" ชม.":"ครบตามแผน"}</span>`;
  return isCur?`<span class="chip wait">ยังขาด ${fh(p-a)} ชม.</span>`:`<span class="chip bad">ขาด ${fh(p-a)} ชม.</span>`}
function weekStat(st){const cw=mon(TODAY),t=wtot(st,cw);return`<div class="stat"><b>${fh(t.a)}/${fh(t.p)} ชม.</b><span>สัปดาห์นี้ (${fd(cw)} – ${fd(addDays(cw,6))}) เรียนจริง / ตามแผน</span></div>`}
function weeklyHtml(st){
  const L=weeks(st),E=SUBJ.filter(s=>st.subj[s].on),cw=mon(TODAY);
  if(!L.length||!E.length)return`<section class="panel"><h2>📊 ชั่วโมงเรียนรายสัปดาห์</h2><p class="sub" style="margin:0">ตั้งวันเริ่มเรียนของวิชาที่สมัครก่อน แล้วตารางรายสัปดาห์จะปรากฏที่นี่</p></section>`;
  let sum=0;L.forEach(w=>sum+=wtot(st,w).a);
  const ov=(w,s)=>((st.wp||{})[w]||{})[s],inp=(id,att,v,ph,lab,extra="")=>`<input class="w" style="width:62px;${extra}" type="number" min="0" max="168" step="0.5" id="${id}" ${att} value="${v}" placeholder="${ph}" aria-label="${lab}">`;
  return`<section class="panel"><h2>📊 ชั่วโมงเรียนรายสัปดาห์: แผน vs เรียนจริง</h2>
  <p class="sub" style="margin:-4px 0 8px">ช่อง "แผน" ใช้กำหนดชั่วโมงที่ต้องเรียนในสัปดาห์นั้น เว้นว่างไว้จะใช้ค่าเฉลี่ยอัตโนมัติ (ตัวเลขจางในช่อง) ส่วนช่อง "จริง" กรอกเมื่อน้องเรียนแล้ว (สัปดาห์จันทร์–อาทิตย์)</p>
  <div class="scroll" id="cw"></div>
  <div class="row f" style="align-items:flex-end;margin:10px 0"><div style="width:150px"><label class="l" for="bs">ตั้งแผนทุกสัปดาห์ของวิชา</label><select id="bs">${E.map(x=>`<option>${x}</option>`).join("")}</select></div>
  <div style="width:130px"><label class="l" for="bh">ชั่วโมง/สัปดาห์</label><input id="bh" type="number" min="0" max="168" step="0.5"></div>
  <button id="bfill" class="act">ใช้กับทุกสัปดาห์ในช่วงเรียน</button><button id="bclr" class="act">กลับเป็นค่าเฉลี่ยอัตโนมัติ</button></div>
  <div class="wkbox" id="cwb"><table style="min-width:${300+E.length*150}px"><thead><tr><th>สัปดาห์</th>${E.map(x=>`<th>${x}<br><small>แผน / จริง (ชม.)</small></th>`).join("")}<th>รวมจริง</th><th>รวมแผน</th><th>สถานะ</th></tr></thead><tbody>`+
  L.map(w=>{const t=wtot(st,w),isC=w===cw,fut=w>cw;
    return`<tr${isC?' id="cwrow"':""}><td style="white-space:nowrap">${fd(w)} – ${fd(addDays(w,6))}${isC?' <span class="chip wait">สัปดาห์นี้</span>':""}</td>`+
    E.map((x,i)=>{const o=ov(w,x);return`<td><div style="display:flex;gap:4px">${inp(`p_${w}_${i}`,`data-wp="${w}" data-ws="${x}"`,o===undefined?"":o,fh(wauto(st,x,w)),`แผน ${x} สัปดาห์ ${fd(w)}`,o===undefined?"":"border-color:var(--accent)")}${inp(`w_${w}_${i}`,`data-wk="${w}" data-ws="${x}"${fut?" disabled":""}`,wact(st,x,w)||"","0",`จริง ${x} สัปดาห์ ${fd(w)}`)}</div></td>`}).join("")+
    `<td><b>${fh(t.a)}</b></td><td>${fh(t.p)}</td><td>${fut?"–":wchip(t.a,t.p,isC)}</td></tr>`}).join("")+
  `</tbody></table></div><p class="src" style="margin:8px 0 0">รวมจากบันทึกรายสัปดาห์ ${fh(sum)} ชม. (ชุดนี้กรอกแยกจากการติ๊กเล่มเรียนด้านล่าง) · กรอบสีฟ้าในช่องแผน = ผู้ดูแลกำหนดเอง</p></section>`}
function weekSvg(st,lit,WK,TT){const all=(WK||weeks)(st);if(!all.length)return"";
  const ci=all.indexOf(mon(TODAY)),L=ci<0?all.slice(0,12):all.slice(Math.max(0,ci-7),ci+5);
  const A=L.map(w=>(TT||wtot)(st,w)),mx=Math.max(1,...A.map(x=>Math.max(x.a,x.p)))*1.15;
  const W=Math.max(430,L.length*64+40),H=220,Lf=38,B=34,T=12,ph=H-B-T,gw=(W-Lf)/L.length,bw=Math.min(20,gw/3);
  let o=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="กราฟแท่งชั่วโมงรายสัปดาห์ แผนเทียบเรียนจริง">`;
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;o+=`<line x1="${Lf}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${Lf-5}" y="${y+4}" font-size="11" text-anchor="end">${Math.round(mx*i/4)}</text>`}
  L.forEach((w,i)=>{const x=Lf+i*gw+gw/2;
    [[A[i].p,"var(--plan)",-bw-1],[A[i].a,"var(--accent)",1]].forEach(([v,c,dx])=>{const h=ph*v/mx;o+=`<rect x="${x+dx}" y="${T+ph-h}" width="${bw}" height="${h}" rx="2" fill="${c}"/>${v>0?`<text x="${x+dx+bw/2}" y="${T+ph-h-3}" font-size="10" text-anchor="middle">${fh(v)}</text>`:""}`});
    o+=`<text x="${x}" y="${H-12}" font-size="10" text-anchor="middle"${w===mon(TODAY)?' style="font-weight:700"':""}>${D0(w).toLocaleDateString("th-TH",{day:"numeric",month:"short"})}</text>`});
  o+="</svg>";if(lit)o=o.replace(/var\(--plan\)/g,"#aab6c8").replace(/var\(--accent\)/g,"#0b7f86").replace(/var\(--line\)/g,"#d9e0ea").replace(/<text /g,'<text fill="#5d6b82" ').replace("<svg ",'<svg style="max-width:100%;height:auto" ');return o}
function weekChart(st){const el=$("cw");if(el)el.innerHTML=weekSvg(st,false)}
function wkSave(st){document.querySelectorAll("#detail details").forEach(d=>d.open?OPEN.add(d.dataset.s):OPEN.delete(d.dataset.s));save(st,true);
  setTimeout(()=>{const id=document.activeElement&&document.activeElement.id;render();if(id){const n=document.getElementById(id);if(n){n.focus();if(n.select)n.select()}}},0)}

function cdInfo(st,s,t){const p=st.subj[s],a=agg(st,s,t);if(!p.on||!a.n)return null;const d=tdates(p,t);
  return{s,t,p,d,a,rem:Math.max(0,a.total-a.done),days:d.end?Math.round((D0(d.end)-D0(TODAY))/864e5):null,fin:a.total-a.done<.05}}
function countdownHtml(st){
  const L=tspans(st).map(z=>cdInfo(st,z.s,z.t)).filter(Boolean);if(!L.length)return"";
  const open=L.filter(x=>!x.fin&&x.days!=null),srt=open.slice().sort((a,b)=>a.days-b.days),near=srt[0],last=srt[srt.length-1];
  const totRem=L.reduce((n,x)=>n+x.rem,0);
  const dT=d=>d<0?`เลย ${-d} วัน`:d===0?"วันนี้":`${d} วัน`;
  const top=`<div class="stats" style="margin-bottom:12px">
   <div class="stat"><b class="${near&&near.days<0?"dng":""}">${near?dT(near.days):"–"}</b><span>${near?`ถึงกำหนดแรก: ${near.s} ${TR[near.t]} (${fd(near.d.end)})`:"ยังไม่มีวันที่ต้องจบที่รออยู่ หรือเรียนครบแล้ว"}</span></div>
   <div class="stat"><b class="${last&&last.days<0?"dng":""}">${last?dT(last.days):"–"}</b><span>${last?`ถึงวันจบสุดท้าย: ${last.s} ${TR[last.t]} (${fd(last.d.end)})`:"–"}</span></div>
   <div class="stat hero"><b>${fh(totRem)} ชม.</b><span>ชั่วโมงคลิปที่ยังเหลือทุกวิชา</span></div></div>`;
  const cards=L.map(x=>{const f=frac(x.p,x.t),hp=x.a.total?x.a.done/x.a.total:0,tp=f==null?0:Math.round(f*100),hpp=Math.round(hp*100);
    const cls=x.fin?"":x.days==null?"":x.days<0?" late":x.days<=14?" warn":"";
    const dTxt=x.fin?"ครบแล้ว":x.days==null?"–":x.days<0?`เลย ${-x.days}`:x.days;
    const pace=x.fin?"เรียนครบทุกเล่มที่สมัครแล้ว":x.days==null?"ตั้งวันเริ่ม–วันจบเพื่อดูการนับถอยหลัง":x.days<=0?`เลยกำหนดแล้ว ยังเหลือ ${fh(x.rem)} ชม.`:`ต้องเรียนเฉลี่ย ${fh(x.rem/(x.days/7))} ชม./สัปดาห์ (${fh(x.rem/x.days)} ชม./วัน)`;
    return`<div class="cd${cls}"><div class="cdh"><b>${x.s} · ${TR[x.t]}</b>${chip(x.a)}</div>
    <div class="cdr"><span>เหลือเวลา</span><b${x.days!=null&&x.days<0&&!x.fin?' class="dng"':""}>${dTxt}${x.fin||x.days==null?"":" <small>วัน</small>"}</b></div>
    <div class="bar"><i style="width:${tp}%;background:var(--plan)"></i></div><div class="src">ใช้เวลาไปแล้ว ${f==null?"–":tp+"%"} · ${fd(x.d.start)} – ${fd(x.d.end)}</div>
    <div class="cdr"><span>เหลือชั่วโมง</span><b>${fh(x.rem)} <small>ชม.</small></b></div>
    <div class="bar"><i style="width:${hpp}%"></i></div><div class="src">เรียนแล้ว ${hpp}% · ${fh(x.a.done)}/${fh(x.a.total)} ชม.</div>
    <div class="src" style="margin-top:6px"><b>${pace}</b></div></div>`}).join("");
  return`<section class="panel"><h2>⏳ นับถอยหลังสู่วันที่ต้องจบตามแผน</h2><p class="sub" style="margin:-4px 0 10px">เทียบแถบเทา (เวลาที่ใช้ไป) กับแถบสีฟ้า (ชั่วโมงที่เรียนแล้ว) ถ้าแถบเทายาวกว่าแสดงว่าเรียนช้ากว่าเวลา</p>${top}<div class="cds">${cards}</div></section>`}

  const W=Math.max(430,L.length*104+40),H=240,Lf=38,B=44,T=12,ph=H-B-T,gw=(W-Lf)/L.length,bw=Math.min(28,gw/3);

document.addEventListener("change",e=>{if(e.target.id==="pf"){setPhoto(e.target.files[0]);e.target.value="";return}
  if(e.target.id==="imp"){importBackup(e.target.files[0]);e.target.value="";return}
  const el=e.target,st=S.find(s=>s.id===cur);if(!st)return;
  if(el.dataset.wk){const w=el.dataset.wk,sj=el.dataset.ws,v=Math.max(0,Math.min(168,+el.value||0));st.wk=st.wk||{};const o=st.wk[w]=st.wk[w]||{};if(v)o[sj]=v;else delete o[sj];if(!Object.keys(o).length)delete st.wk[w];wkSave(st);return}
  if(el.dataset.wp){const w=el.dataset.wp,sj=el.dataset.ws;st.wp=st.wp||{};const o=st.wp[w]=st.wp[w]||{};if(el.value.trim()==="")delete o[sj];else o[sj]=Math.max(0,Math.min(168,+el.value||0));if(!Object.keys(o).length)delete st.wp[w];wkSave(st);return}
  if(el.dataset.hwk){const w=el.dataset.hwk,sj=el.dataset.ws,v=Math.max(0,Math.min(168,+el.value||0));st.hwk=st.hwk||{};const o=st.hwk[w]=st.hwk[w]||{};if(v)o[sj]=v;else delete o[sj];if(!Object.keys(o).length)delete st.hwk[w];wkSave(st);return}
  if(el.dataset.hwp){const w=el.dataset.hwp,sj=el.dataset.ws;st.hwp=st.hwp||{};const o=st.hwp[w]=st.hwp[w]||{};if(el.value.trim()==="")delete o[sj];else o[sj]=Math.max(0,Math.min(168,+el.value||0));if(!Object.keys(o).length)delete st.hwp[w];wkSave(st);return}
  if(el.dataset.f==="staffId"){moveStudent(st,el.value);render();return}
  if(el.dataset.f){st[el.dataset.f]=el.value;save(st,true);render();return}
  if(el.dataset.sj){const p=st.subj[el.dataset.sj],k=el.dataset.k;if(k==="on")p.on=el.checked;else if(k==="t0")p.t[0]=+el.checked;else if(k==="t1")p.t[1]=+el.checked;else p[k]=el.value}
  else if(el.dataset.c||el.dataset.w){const x=C.find(o=>o.c===(el.dataset.c||el.dataset.w));if(!x)return;st.w[x.c]=el.dataset.c?(el.checked?x.h:0):Math.max(0,Math.min(x.h,+el.value||0))}
  else if(el.dataset.hp){const k=el.dataset.hp,f=el.dataset.k;st.hp=st.hp||{};const r=st.hp[k]=st.hp[k]||{on:false,enr:"",mo:""};
    if(f==="on"){r.on=el.checked;if(r.on&&!r.enr)r.enr=TODAY}else if(f==="mo")r.mo=el.value.trim()===""?"":Math.max(1,Math.min(36,+el.value||0));else r[f]=el.value}
  else if(el.dataset.hc){const x=HI[el.dataset.hc];if(!x)return;st.hw=st.hw||{};st.hw[x.c]=el.checked?x.h:0}
  else if(el.dataset.hv){const x=HI[el.dataset.hv];if(!x)return;st.hw=st.hw||{};st.hw[x.c]=Math.max(0,Math.min(x.h,+el.value||0))}
  else return;
  document.querySelectorAll("#detail details").forEach(d=>d.open?OPEN.add(d.dataset.s):OPEN.delete(d.dataset.s));
  save(st,true);render()});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target&&e.target.id==="code")doLogin()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")poll()});
init();
</script>
</body>
</html>
